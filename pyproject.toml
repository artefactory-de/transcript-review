[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "transcript-anonymizer"
version = "0.2.4"
description = "Offline transcript PII review and clean DOCX export"
requires-python = ">=3.12,<3.14"
dependencies = ["python-docx>=1.2,<2", "openpyxl>=3.1.5,<4", "defusedxml>=0.7.1,<1"]

[project.optional-dependencies]
model = ["gliner2[local]==2.0.0", "torch==2.8.0", "transformers>=4.51,<5", "sentencepiece>=0.2,<1", "protobuf>=5,<7"]
build = ["pyinstaller>=6,<7"]

[project.scripts]
transcript-anonymizer = "transcript_anonymizer.cli:main"

[project.gui-scripts]
transcript-review = "transcript_anonymizer.desktop:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402"] # Offline environment setup precedes selected script imports.

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
